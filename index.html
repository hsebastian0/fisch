	<div id="ar-container"></div>

	<div class="log" id="log">asdasdsa</div>

	<div id="overlay">
		<button id="start-button">Iniciar</button>
		<div id="progress-container">
			<div id="progress-bar-track">

			</div>

		</div>

	<script type="module">

		import * as THREE from './js/three.module.js';
		import { APP } from './js/app.js';
		import { MindARController } from './js/mindar/mindar_controller.js';

		window.THREE = THREE; // Used by APP Scripts.

		const log = document.getElementById('log');
		const overlay = document.getElementById('overlay');
		const startButton = document.getElementById('start-button');
		const arContainer = document.getElementById('ar-container');
		const progressContainer = document.getElementById('progress-container');
		const progressFill = document.getElementById('progress-bar-fill');
		const progressLabel = document.getElementById('progress-label');

		const debugMode = new URLSearchParams(location.search).get('debug') === '1';

		let player = null;
		let mindarController = null;
		let loaded = false;
		let loadPromise = null;

		function setProgress(percent, text) {
			progressFill.style.width = `${percent}%`;
			progressLabel.textContent = `${text} ${percent}%`;
		}

		async function loadEverything() {

			if (loadPromise) return loadPromise;

			loadPromise = (async () => {

				setProgress(0, 'Cargando escena...');

				// Descarga app.json con progreso real (0% - 25%)
				const text = await new Promise((resolve, reject) => {
					const loader = new THREE.FileLoader();
					loader.load(
						'app.json',
						(t) => resolve(t),
						(e) => {
							if (e.lengthComputable) {
								const p = Math.round((e.loaded / e.total) * 25);
								setProgress(p, 'Cargando escena...');
							}
						},
						(err) => reject(new Error(err.statusText || 'No se pudo descargar el json'))
					);
				});

				player = new APP.Player({ alpha: true });
				await player.load(JSON.parse(text));
				player.setSize(window.innerWidth, window.innerHeight);
				player.play();
				setProgress(55, 'Escena lista...');

				document.body.appendChild(player.dom);

				window.addEventListener('resize', function () {
					player.setSize(window.innerWidth, window.innerHeight);
				});

				window.player = player;

				setProgress(85, 'Preparando AR...');
				log.textContent = 'initializing...';

				await new Promise((resolve) => setTimeout(resolve, 10));

				setProgress(100, 'Listo');
				loaded = true;

				console.log(window.player);

			})().catch((e) => {
				loaded = false;
				loadPromise = null; // permite reintentar al pulsar el botón
				throw e;
			});

			return loadPromise;
		}

		// Al darle al botón start se inicia la cámara (requiere gesto del usuario).
		startButton.addEventListener('click', async () => {

			progressContainer.style.display = 'flex';

			try {
				await loadEverything();
				if (!loaded) return;

				setProgress(90, 'Iniciando cámara...');

				// La cámara se inicia aquí, dentro del gesto del usuario.
				mindarController = new MindARController(arContainer, player, debugMode);
				window.mindarController = mindarController;

				await mindarController.start();

				// El player sigue funcionando (scripts/audio) pero su canvas ya no se usa.
				if (player?.dom) player.dom.style.display = 'none';

				overlay.classList.add('hidden');
				setTimeout(() => overlay.remove(), 400);
			} catch (e) {
				console.error('Error durante la carga:', e);
				startButton.textContent = 'Reintentar';
				setProgress(0, 'Error al iniciar');
			}
		});

		// Todo se carga automáticamente al abrir la página.
		loadEverything().catch((e) => {
			console.error('Error durante la carga automática:', e.message);
			progressContainer.style.display = 'flex';
			setProgress(0, 'Error al cargar');
			startButton.textContent = 'Reintentar';
		});

	</script>

	<script>
	/* =====================================================================
	   FISCH: botones + objetos 3D sobre el marcador.
	   No toca el flujo de tu app: espera a que window.mindarController
	   esté iniciado y agrega sus objetos al anchor del target 0.
	   ===================================================================== */
	(function () {

		const CONTENT = {
			mascota: {
				title: 'La Mascota',
				text: 'Fisch es más que un pez, es una actitud. Curioso, libre y siempre en movimiento.',
				tag: '¡Siempre Fisch!'
			},
			camiseta: {
				title: 'La Camiseta',
				text: 'Una camiseta cómoda, con el estilo único de Fisch. Hecha para quienes se atreven a ser diferentes.',
				tag: 'Vístete de actitud'
			},
			empaque: {
				title: 'El Empaque',
				text: 'Una lata de sardinas, que guarda algo mucho mejor: una camiseta de Fisch. Porque lo bueno siempre viene en lata.',
				tag: 'Buena vibra, en lata.'
			}
		};

		// Si tienes modelos .glb propios, pon aquí la ruta y reemplazan a los generados.
		// La mascota usa por defecto el pez que ya está en tu app.json.
		const MODEL_URLS = { mascota: null, camiseta: null, empaque: null };
		const MODEL_SIZE = 0.6; // tamaño máximo del objeto, en unidades de MindAR (1 = ancho del marcador)

		const ui = document.getElementById('fisch-ui');
		const hint = document.getElementById('fisch-hint');
		const card = document.getElementById('fisch-card');
		const buttons = [...document.querySelectorAll('.fisch-btn')];

		function waitForAR() {
			const mc = window.mindarController;
			if (mc && mc.started && mc.mindar && mc.anchors.length) init(mc).catch(e => console.error('Fisch UI:', e));
			else setTimeout(waitForAR, 250);
		}
		waitForAR();

		async function init(mc) {

			const THREE = window.THREE;
			const anchor = mc.anchors[0];

			try { await document.fonts.load('700 100px Caveat'); await document.fonts.load('700 26px "DM Sans"'); } catch (e) {}

			// Mismo criterio que mindar_controller: el contenido se diseña con Y hacia arriba.
			const holder = new THREE.Group();
			holder.rotation.x = Math.PI / 2;
			holder.add(new THREE.HemisphereLight(0xffffff, 0x6a7a99, 1.1));
			anchor.group.add(holder);

			// ---------- utilidades ----------
			function canvasTex(w, h, draw) {
				const c = document.createElement('canvas'); c.width = w; c.height = h;
				draw(c.getContext('2d'), w, h);
				const t = new THREE.CanvasTexture(c);
				t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
				return t;
			}
			function crown(ctx, cx, cy, s, color) {
				ctx.fillStyle = color; ctx.beginPath();
				ctx.moveTo(cx - s, cy + s * .6); ctx.lineTo(cx - s, cy - s * .2); ctx.lineTo(cx - s * .5, cy + s * .2);
				ctx.lineTo(cx, cy - s * .6); ctx.lineTo(cx + s * .5, cy + s * .2); ctx.lineTo(cx + s, cy - s * .2);
				ctx.lineTo(cx + s, cy + s * .6); ctx.closePath(); ctx.fill();
			}
			function logo(ctx, cx, cy, size, color) {
				crown(ctx, cx + size * .3, cy - size * .62, size * .14, color);
				ctx.fillStyle = color; ctx.font = `700 ${size}px Caveat, cursive`;
				ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
				ctx.fillText('Fisch', cx, cy);
			}
			function roundRect(w, h, r) {
				const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
				s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
				s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
				s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
				s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
				return s;
			}
			// Extruye hacia +Y (acostado sobre el marcador, cara hacia arriba).
			function flat(shape, depth, bevel = 0) {
				const g = new THREE.ExtrudeGeometry(shape, {
					depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2, curveSegments: 12
				});
				g.rotateX(-Math.PI / 2);
				return g;
			}
			function topPlane(w, h, tex, y, x = 0, z = 0) {
				const g = new THREE.PlaneGeometry(w, h); g.rotateX(-Math.PI / 2);
				const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: .6 }));
				m.position.set(x, y, z); return m;
			}
			const mat = (color, metalness = 0, roughness = .6) => new THREE.MeshStandardMaterial({ color, metalness, roughness });

			function fitTo(root, content, size) {
				root.updateMatrixWorld(true);
				const box = new THREE.Box3().setFromObject(content);
				const dim = box.getSize(new THREE.Vector3());
				const k = size / Math.max(dim.x, dim.y, dim.z, 1e-6);
				content.scale.multiplyScalar(k);
				root.updateMatrixWorld(true);
				const c = new THREE.Box3().setFromObject(content).getCenter(new THREE.Vector3());
				content.position.sub(c);
			}

			// ---------- cada objeto vive en: tilt (inclinación) > pivot (giro) ----------
			const slots = {};
			function makeSlot(key, tiltX) {
				const tilt = new THREE.Group(), pivot = new THREE.Group();
				tilt.rotation.x = tiltX; tilt.visible = false;
				tilt.add(pivot); holder.add(tilt);
				slots[key] = { tilt, pivot, baseTilt: tiltX };
				return slots[key];
			}

			// ---------- LA MASCOTA: el pez de tu app.json ----------
			let mixer = null;
			{
				const s = makeSlot('mascota', 0);
				const fish = window.player && window.player.scene && window.player.scene.getObjectByName('orange_fish_rig.glb');
				if (fish) {
					fish.removeFromParent();
					fish.position.set(0, 0, 0); fish.rotation.set(0, 0, 0);
					fish.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
					const wrap = new THREE.Group(); wrap.add(fish);
					fitTo(wrap, fish, MODEL_SIZE);
					s.pivot.add(wrap);

					const clips = [];
					fish.traverse(o => { if (o.animations && o.animations.length) clips.push(...o.animations); });
					if (clips.length) {
						mixer = new THREE.AnimationMixer(fish);
						clips.forEach(c => mixer.clipAction(c).play());
					}
				} else {
					console.warn('Fisch UI: no se encontró orange_fish_rig.glb en la escena.');
				}
			}

			// ---------- LA CAMISETA ----------
			{
				const s = makeSlot('camiseta', 0.55);
				const sh = new THREE.Shape();
				sh.moveTo(-.15, .30); sh.quadraticCurveTo(0, .20, .15, .30);
				sh.lineTo(.30, .26); sh.lineTo(.48, .08); sh.lineTo(.40, -.02); sh.lineTo(.28, .05);
				sh.lineTo(.28, -.30); sh.lineTo(-.28, -.30); sh.lineTo(-.28, .05);
				sh.lineTo(-.40, -.02); sh.lineTo(-.48, .08); sh.lineTo(-.30, .26); sh.closePath();

				const shirt = new THREE.Mesh(flat(sh, .03, .006), mat(0xefe8d8, 0, .92));
				const tex = canvasTex(256, 160, (ctx, w, h) => logo(ctx, w / 2, h * .6, 96, '#0f1a3d'));
				const logoPlane = topPlane(.24, .15, tex, .037, .13, -.1);
				const g = new THREE.Group(); g.add(shirt, logoPlane);
				g.position.y = -.015;
				s.pivot.add(g);
			}

			// ---------- EL EMPAQUE: lata cerrada + lata abierta con la camiseta dentro ----------
			{
				const s = makeSlot('empaque', 0.55);
				const W = .5, D = .3, H = .09;
				const silver = mat(0xc9d1e0, .9, .28);
				const blue = mat(0x1a3a9c, .55, .4);

				// lata cerrada (tapa impresa)
				const can = new THREE.Group();
				const body = new THREE.Mesh(flat(roundRect(W, D, .07), H, .004), blue);
				const rim = new THREE.Mesh(flat(roundRect(W + .012, D + .012, .074), .018), silver); rim.position.y = H - .012;
				const label = canvasTex(520, 300, (ctx, w, h) => {
					ctx.fillStyle = '#1a3a9c'; ctx.fillRect(0, 0, w, h);
					ctx.fillStyle = '#2f5fd0'; ctx.beginPath(); ctx.moveTo(0, h);
					for (let x = 0; x <= w; x += 8) ctx.lineTo(x, h * .82 + Math.sin(x / 28) * 9);
					ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
					logo(ctx, w * .5, h * .42, 150, '#ffffff');
					ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
					ctx.font = '700 28px "DM Sans", sans-serif'; ctx.fillText('SARDINAS EN LATA', w * .5, h * .72);
					ctx.font = '700 16px "DM Sans", sans-serif'; ctx.fillText('INCLUYE CAMISETA', w * .78, h * .9);
				});
				const lid = topPlane(W - .035, D - .035, label, H + .0065);
				const ring = new THREE.Mesh(new THREE.TorusGeometry(.03, .007, 10, 24).rotateX(-Math.PI / 2), silver);
				ring.position.set(-W / 2 + .075, H + .012, 0);
				can.add(body, rim, lid, ring);
				can.position.set(-.18, 0, .13);
				can.rotation.y = .12;

				// lata abierta con camiseta
				const tin = new THREE.Group();
				const base = new THREE.Mesh(flat(roundRect(W, D, .07), .01), silver);
				const wallShape = roundRect(W, D, .07); wallShape.holes.push(roundRect(W - .03, D - .03, .055));
				const wall = new THREE.Mesh(flat(wallShape, .07, .002), silver);
				const folded = new THREE.Mesh(flat(roundRect(W - .05, D - .05, .035), .06, .006), mat(0xefe8d8, 0, .92));
				folded.position.y = .012;
				const tex = canvasTex(300, 180, (ctx, w, h) => logo(ctx, w * .62, h * .6, 100, '#0f1a3d'));
				const logoPlane = topPlane(W - .09, (W - .09) * .6, tex, .0755);
				tin.add(base, wall, folded, logoPlane);
				tin.position.set(.2, 0, -.13);
				tin.rotation.y = -.1;

				const g = new THREE.Group(); g.add(can, tin); g.scale.setScalar(.92);
				s.pivot.add(g);
			}

			// ---------- .glb opcionales ----------
			Object.keys(MODEL_URLS).forEach(async key => {
				const url = MODEL_URLS[key];
				if (!url || !window.ThreeGLTFLoader) return;
				try {
					const gltf = await new window.ThreeGLTFLoader().loadAsync(url);
					const wrap = new THREE.Group(); wrap.add(gltf.scene);
					fitTo(wrap, gltf.scene, MODEL_SIZE);
					slots[key].pivot.clear(); slots[key].pivot.add(wrap);
				} catch (e) { console.warn('Fisch UI: no se pudo cargar', url, e); }
			});

			// ---------- botones e información ----------
			let selected = null, found = false;

			function select(key) {
				selected = key;
				Object.entries(slots).forEach(([k, s]) => { s.tilt.visible = (k === key); });
				buttons.forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key));
				const c = CONTENT[key];
				document.getElementById('fisch-title').textContent = c.title;
				document.getElementById('fisch-text').textContent = c.text;
				document.getElementById('fisch-tag').textContent = c.tag;
				card.classList.add('open');
			}
			function clear() {
				selected = null;
				Object.values(slots).forEach(s => { s.tilt.visible = false; });
				buttons.forEach(b => b.setAttribute('aria-pressed', 'false'));
				card.classList.remove('open');
			}
			buttons.forEach(b => b.addEventListener('click', () => select(b.dataset.key)));
			document.getElementById('fisch-close').addEventListener('click', clear);

			mc.addListener('found', () => {
				found = true; hint.classList.add('hidden');
				if (!selected) select('mascota');
			});
			mc.addListener('lost', () => { found = false; hint.classList.remove('hidden'); });

			// ---------- girar con el dedo + giro automático ----------
			let dragging = false, lx = 0, ly = 0, last = performance.now();
			document.addEventListener('pointerdown', e => {
				if (e.target.closest('#fisch-ui')) return;
				dragging = true; lx = e.clientX; ly = e.clientY;
			});
			document.addEventListener('pointermove', e => {
				if (!dragging || !selected) return;
				const s = slots[selected];
				s.pivot.rotation.y += (e.clientX - lx) * .012;
				s.tilt.rotation.x = Math.max(-.3, Math.min(1.3, s.tilt.rotation.x + (e.clientY - ly) * .008));
				lx = e.clientX; ly = e.clientY;
			});
			['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { dragging = false; }));

			mc.addListener('update', () => {
				const now = performance.now(), dt = now - last; last = now;
				if (mixer) mixer.update(dt / 1000);
				if (selected && !dragging) slots[selected].pivot.rotation.y += dt * .0006;
			});

			ui.classList.add('on');
		}
	})();
	</script>

</body>
