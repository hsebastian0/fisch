<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fisch · Experiencia AR</title>

  <!-- A-Frame + MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #0b1530;
      --blue: #1d3fa8;
      --blue-soft: #3f7be0;
      --cream: #f1ebdd;
      --ink: #ffffff;
      --panel: rgba(8, 16, 38, 0.88);
      --line: rgba(120, 160, 255, 0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "DM Sans", system-ui, sans-serif; }

    /* ---------- UI overlay ---------- */
    #ui {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }
    #topbar {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      background: linear-gradient(rgba(0,0,0,.55), transparent);
      color: var(--ink);
    }
    #topbar .logo { font-family: "Caveat", cursive; font-size: 34px; line-height: 1; }
    #topbar .hint { font-size: 13px; opacity: .85; }

    #scan-hint {
      align-self: center; margin: 0 24px; padding: 10px 16px; border-radius: 999px;
      background: var(--panel); color: var(--ink); font-size: 14px; text-align: center;
      border: 1px solid var(--line); transition: opacity .3s;
    }
    #scan-hint.hidden { opacity: 0; }

    #bottom { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* ---------- Info card ---------- */
    #card {
      pointer-events: auto; position: relative;
      background: var(--panel); color: var(--ink);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 16px 44px 14px 16px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transform: translateY(12px); opacity: 0; visibility: hidden;
      transition: transform .25s ease, opacity .25s ease, visibility .25s;
    }
    #card.open { transform: none; opacity: 1; visibility: visible; }
    #card h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
    #card p { margin: 0 0 8px; font-size: 15px; line-height: 1.45; max-width: 60ch; }
    #card .tag { font-family: "Caveat", cursive; font-size: 24px; color: #9fc0ff; margin: 0; }
    #close {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
      border: 0; border-radius: 50%; background: transparent; color: var(--ink);
      font-size: 22px; cursor: pointer;
    }
    #close:focus-visible, .obj-btn:focus-visible { outline: 3px solid #9fc0ff; outline-offset: 2px; }

    /* ---------- Three buttons ---------- */
    #buttons { display: flex; justify-content: center; gap: 22px; pointer-events: auto; }
    .obj-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: none; border: 0; color: var(--ink); font: 500 13px "DM Sans", sans-serif; cursor: pointer;
    }
    .obj-btn .circle {
      width: 64px; height: 64px; border-radius: 50%; background: var(--cream);
      display: grid; place-items: center; border: 3px solid transparent;
      transition: border-color .2s, transform .2s;
    }
    .obj-btn svg { width: 32px; height: 32px; stroke: var(--navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .obj-btn[aria-pressed="true"] .circle { border-color: var(--blue-soft); transform: scale(1.08); }

    @media (prefers-reduced-motion: reduce) {
      #card, .obj-btn .circle { transition: none; }
    }
  </style>
</head>

<body>
  <!-- ========== UI ========== -->
  <div id="ui">
    <div>
      <div id="topbar">
        <span class="logo">Fisch</span>
        <span class="hint">Gira para ver todos los ángulos</span>
      </div>
      <div id="scan-hint">Apunta la cámara a la imagen de Fisch</div>
    </div>

    <div id="bottom">
      <section id="card" aria-live="polite">
        <button id="close" aria-label="Cerrar">×</button>
        <h2 id="card-title"></h2>
        <p id="card-text"></p>
        <p class="tag" id="card-tag"></p>
      </section>

      <div id="buttons" role="group" aria-label="Objetos de Fisch">
        <button class="obj-btn" data-key="mascota" aria-pressed="false">
          <span class="circle">
            <svg viewBox="0 0 32 32"><path d="M3 16c4-7 12-9 18-5l5-4v18l-5-4c-6 4-14 2-18-5z"/><circle cx="9" cy="14" r="1.2"/></svg>
          </span>La Mascota
        </button>
        <button class="obj-btn" data-key="camiseta" aria-pressed="false">
          <span class="circle">
            <svg viewBox="0 0 32 32"><path d="M11 5l-8 4 3 6 3-1v13h14V14l3 1 3-6-8-4c-1 2-3 3-5 3s-4-1-5-3z"/></svg>
          </span>La Camiseta
        </button>
        <button class="obj-btn" data-key="empaque" aria-pressed="false">
          <span class="circle">
            <svg viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="14" rx="5"/><circle cx="12" cy="16" r="2.2"/></svg>
          </span>El Empaque
        </button>
      </div>
    </div>
  </div>

  <!-- ========== AR SCENE ========== -->
  <!-- targets.mind: compílalo con https://hiukim.github.io/mind-ar-js-doc/tools/compile -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: yes; uiScanning: no; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="0.9"></a-light>
    <a-light type="directional" position="1 2 3" intensity="1.1"></a-light>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- ====================== LA MASCOTA (pez) ====================== -->
      <a-entity id="mascota" class="model" visible="false" position="0 0 0.35" drag-rotate>
        <!-- cuerpo -->
        <a-sphere position="0 0 0" radius="0.28" scale="0.85 1 0.8" color="#2f6fd6" material="roughness:.5"></a-sphere>
        <!-- panza -->
        <a-sphere position="0 -0.1 0.1" radius="0.2" scale="0.9 0.9 0.8" color="#eaf2ff" material="roughness:.6"></a-sphere>
        <!-- ojo -->
        <a-sphere position="-0.02 0.08 0.2" radius="0.09" color="#ffffff"></a-sphere>
        <a-sphere position="-0.02 0.08 0.28" radius="0.05" color="#111"></a-sphere>
        <!-- boca -->
        <a-sphere position="0.1 -0.06 0.2" radius="0.07" scale="1.3 .8 .8" color="#8a3b2e"></a-sphere>
        <!-- gorra -->
        <a-sphere position="0 0.26 0" radius="0.2" scale="1 .6 1" color="#0f1a3d"></a-sphere>
        <a-box position="0.12 0.2 0.15" width="0.28" height="0.02" depth="0.18" color="#0f1a3d" rotation="-8 0 0"></a-box>
        <!-- aletas y cola -->
        <a-cone position="-0.3 0 0" radius-bottom="0.08" radius-top="0" height="0.18" rotation="0 0 90" color="#1d56c0"></a-cone>
        <a-cone position="0.28 -0.02 0" radius-bottom="0.08" radius-top="0" height="0.18" rotation="0 0 -90" color="#1d56c0"></a-cone>
        <a-cone position="0 -0.38 -0.02" radius-bottom="0.1" radius-top="0" height="0.28" rotation="180 0 0" color="#2f6fd6"></a-cone>
        <!-- camiseta mini -->
        <a-box position="0 -0.2 0.12" width="0.3" height="0.22" depth="0.16" color="#efe8d8"></a-box>
        <a-text value="Fisch" position="0 -0.2 0.205" align="center" width="0.9" color="#0f1a3d"></a-text>
      </a-entity>

      <!-- ====================== LA CAMISETA ====================== -->
      <a-entity id="camiseta" class="model" visible="false" position="0 0 0.3" drag-rotate>
        <a-box position="0 0 0" width="0.5" height="0.6" depth="0.08" color="#efe8d8"></a-box>
        <a-box height="0.2" width="0.24" depth="0.08" color="#efe8d8" position="-0.36 0.2 0" rotation="0 0 35"></a-box>
        <a-box position="0.36 0.2 0" height="0.2" width="0.24" depth="0.08" color="#efe8d8" rotation="0 0 -35"></a-box>
        <a-torus position="0 0.3 0.01" radius="0.08" radius-tubular="0.012" color="#d8d0bd" rotation="0 0 0"></a-torus>
        <a-text value="Fisch" position="0.1 0.05 0.045" align="center" width="1.3" color="#0f1a3d"></a-text>
        <a-text value="Fisch" position="-0.1 0.05 -0.045" rotation="0 180 0" align="center" width="1.3" color="#0f1a3d"></a-text>
      </a-entity>

      <!-- ====================== EL EMPAQUE (lata + camiseta dentro) ====================== -->
      <a-entity id="empaque" class="model" visible="false" position="0 0 0.25" drag-rotate>
        <!-- base de la lata -->
        <a-box position="0 0 0" width="0.8" height="0.5" depth="0.16" color="#1a3a9c" material="metalness:.6; roughness:.35"></a-box>
        <a-box position="0 0 0.082" width="0.74" height="0.44" depth="0.01" color="#cfd6e4" material="metalness:.9; roughness:.25"></a-box>
        <!-- camiseta doblada dentro -->
        <a-box position="0 0 0.1" width="0.66" height="0.38" depth="0.05" color="#efe8d8"></a-box>
        <a-text value="Fisch" position="0.17 -0.03 0.128" align="center" width="1.1" color="#0f1a3d"></a-text>
        <!-- tapa abierta -->
        <a-entity position="0 0.25 0.08" rotation="-110 0 0">
          <a-box position="0 0.25 0" width="0.8" height="0.5" depth="0.02" color="#1a3a9c" material="metalness:.6; roughness:.35"></a-box>
          <a-text value="Fisch" position="0 0.3 0.012" align="center" width="2.2" color="#ffffff"></a-text>
          <a-text value="SARDINAS EN LATA" position="0 0.14 0.012" align="center" width="1.1" color="#ffffff"></a-text>
          <a-torus position="0 0.45 0.015" radius="0.05" radius-tubular="0.01" color="#cfd6e4" material="metalness:1; roughness:.2"></a-torus>
        </a-entity>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    /* =========================================================
       CONTENIDO: historia de Fisch para cada botón
       ========================================================= */
    const CONTENT = {
      mascota: {
        title: "La Mascota",
        text: "Fisch es más que un pez, es una actitud. Curioso, libre y siempre en movimiento.",
        tag: "¡Siempre Fisch!"
      },
      camiseta: {
        title: "La Camiseta",
        text: "Una camiseta cómoda, con el estilo único de Fisch. Hecha para quienes se atreven a ser diferentes.",
        tag: "Vístete de actitud"
      },
      empaque: {
        title: "El Empaque",
        text: "Una lata de sardinas, que guarda algo mucho mejor: una camiseta de Fisch. Porque lo bueno siempre viene en lata.",
        tag: "Buena vibra, en lata."
      }
    };

    /* =========================================================
       MODELOS .glb (opcional): cuando tengas tus modelos reales,
       pon la ruta aquí y reemplazan a las figuras de ejemplo.
       ========================================================= */
    const MODELS = {
      mascota:  "",   // ej: "./models/fisch-mascota.glb"
      camiseta: "",   // ej: "./models/fisch-camiseta.glb"
      empaque:  ""    // ej: "./models/fisch-lata.glb"
    };
    const MODEL_SCALE = { mascota: "0.6 0.6 0.6", camiseta: "0.6 0.6 0.6", empaque: "0.6 0.6 0.6" };

    /* ---- Gira el objeto con el dedo/mouse; si nadie lo toca, gira solo ---- */
    AFRAME.registerComponent("drag-rotate", {
      init() {
        this.dragging = false; this.lastX = 0; this.lastY = 0;
        this.rotY = 0; this.rotX = 0;
        const down = e => { const p = e.touches ? e.touches[0] : e; this.dragging = true; this.lastX = p.clientX; this.lastY = p.clientY; };
        const move = e => {
          if (!this.dragging) return;
          const p = e.touches ? e.touches[0] : e;
          this.rotY += (p.clientX - this.lastX) * 0.6;
          this.rotX = Math.max(-60, Math.min(60, this.rotX + (p.clientY - this.lastY) * 0.4));
          this.lastX = p.clientX; this.lastY = p.clientY;
        };
        const up = () => { this.dragging = false; };
        window.addEventListener("touchstart", down, { passive: true });
        window.addEventListener("touchmove", move, { passive: true });
        window.addEventListener("touchend", up);
        window.addEventListener("mousedown", down);
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      },
      tick(t, dt) {
        if (!this.el.getAttribute("visible")) return;
        if (!this.dragging) this.rotY += dt * 0.03;   // giro automático lento
        this.el.object3D.rotation.set(
          THREE.MathUtils.degToRad(this.rotX),
          THREE.MathUtils.degToRad(this.rotY), 0);
      }
    });

    /* ---- Lógica de botones ---- */
    const card = document.getElementById("card");
    const buttons = [...document.querySelectorAll(".obj-btn")];
    const scanHint = document.getElementById("scan-hint");
    let current = "mascota";
    let targetFound = false;

    function show(key) {
      current = key;
      document.querySelectorAll(".model").forEach(m => m.setAttribute("visible", m.id === key));
      buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.key === key));
      const c = CONTENT[key];
      document.getElementById("card-title").textContent = c.title;
      document.getElementById("card-text").textContent = c.text;
      document.getElementById("card-tag").textContent = c.tag;
      card.classList.add("open");
    }
    function hideAll() {
      document.querySelectorAll(".model").forEach(m => m.setAttribute("visible", false));
      buttons.forEach(b => b.setAttribute("aria-pressed", "false"));
      card.classList.remove("open");
    }

    buttons.forEach(b => b.addEventListener("click", () => show(b.dataset.key)));
    document.getElementById("close").addEventListener("click", hideAll);

    /* ---- Reemplaza figuras por .glb si hay ruta ---- */
    Object.entries(MODELS).forEach(([key, src]) => {
      if (!src) return;
      const el = document.getElementById(key);
      while (el.firstChild) el.removeChild(el.firstChild);
      const m = document.createElement("a-gltf-model");
      m.setAttribute("src", src);
      m.setAttribute("scale", MODEL_SCALE[key]);
      el.appendChild(m);
    });

    /* ---- Detección de la imagen ---- */
    document.addEventListener("DOMContentLoaded", () => {
      const target = document.getElementById("target");
      target.addEventListener("targetFound", () => {
        targetFound = true;
        scanHint.classList.add("hidden");
        show(current);
      });
      target.addEventListener("targetLost", () => {
        targetFound = false;
        scanHint.classList.remove("hidden");
      });
    });
  </script>
</body>
</html>
